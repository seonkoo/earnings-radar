name: 每日财报舆情抓取

on:
  schedule:
    - cron: '30 0 * * *'   # 北京时间 08:30（盘前）
    - cron: '30 3 * * *'   # 北京时间 11:30（午间，捕捉韩股/日股盘中熔断）
    - cron: '0 7 * * *'    # 北京时间 15:00（A股收盘后）
    - cron: '0 14 * * *'   # 北京时间 22:00（美股盘后）
  workflow_dispatch:       # 支持手动触发（首次建库后点一次即可立即启用 Pages）

# 严禁并发：两次运行（手动+定时重叠）排队而非同时 push，避免 main 被 rejected
concurrency:
  group: earnings-daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取东方财富（板块资金流 + 财报公告）并生成快照
        run: python generate.py

      - name: 生成每日要闻简报（含可选 LLM 辅助：设 ZHIPU_API_KEY / SILICONFLOW_API_KEY 即启用，未设则词库生成）
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python brief.py

      - name: 提交快照与简报（latest.json + brief.json + 归档）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 多维快照 + 每日要闻 $(date +'%Y-%m-%d %H:%M %Z')" || echo "no changes"
          git push

      - name: 启用 GitHub Pages（首次自动开启，之后幂等）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST /repos/${{ github.repository }}/pages \
            -f source[branch]=main \
            -f source[path]=/ || true
